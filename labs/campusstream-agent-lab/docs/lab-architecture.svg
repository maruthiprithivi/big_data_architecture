<title id="title">CampusStream local lab: deployment and the evidence path</title>
<desc id="desc">On a student laptop, a browser connects only to the Python app on localhost port 8090. Inside Docker Compose, the app requests a bounded JSON plan and an evidence reflection from a CPU Qwen model, validates choices, executes a read-only SELECT against ClickHouse and builds a chart from exact returned rows. The model cannot access the database directly. At setup a one-shot downloader fills a named model cache and ClickHouse init.sql generates one million synthetic sessions.</desc>
