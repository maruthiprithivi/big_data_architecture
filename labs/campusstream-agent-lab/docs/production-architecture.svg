<rect width="1280" height="470" fill="#f5f1e7"/>
<title id="title">CampusStream: from viewer activity to a measured homepage decision</title>
<desc id="desc">Conceptual production design. Web and mobile viewer events flow through a durable buffer and preparation into ClickHouse. A dashboard compares titles. People choose a homepage test, observe return visits and quick exits, then feed that evidence into the next viewing experience. These ingestion components are not implemented in the local lab.</desc>
